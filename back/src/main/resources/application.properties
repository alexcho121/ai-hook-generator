spring.application.name=hookgenerator

server.port=${PORT:8080}

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.responses.url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/hookdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
